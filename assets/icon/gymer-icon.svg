<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Nền xanh Zalo, full-bleed, không bo góc, không viền -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0068FF"/>
  <!-- Ghim vị trí trắng, nằm trong vùng an toàn 80% (102..922) -->
