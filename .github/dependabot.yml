# Dependabot: mỗi tuần mở PR cập nhật action (đã pin SHA) và npm. Tối đa 5 PR mở cùng lúc mỗi ecosystem.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Bỏ qua bản nâng MAJOR: vite, vitest, eslint... phụ thuộc lẫn nhau và có thể ảnh hưởng zmp-sdk/zmp-ui, sẽ nâng gộp thủ công trong một đợt riêng.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Công cụ zmp-cli dùng khi deploy Zalo, có lockfile riêng (tools/zmp-cli). Cùng luật bỏ qua major như mục gốc.
  - package-ecosystem: "npm"
    directory: "/tools/zmp-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
