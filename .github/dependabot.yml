# Dependabot: mỗi tuần mở PR cập nhật action (đã pin SHA) và npm. Tối đa 5 PR mở cùng lúc mỗi ecosystem.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
